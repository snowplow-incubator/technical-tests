name: ci
on:
  push:
    branches: 'main'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go 1.24.x
        uses: actions/setup-go@v5
        with:
          # Semantic version range syntax or exact version of Go
          go-version: '1.24.x'
      - uses: actions/checkout@v4
        with:
           ref: ${{ github.event.pull_request.head.ref }}
      - uses: TimonVS/pr-labeler-action@v5
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images
        run: docker compose -f docker-compose.yml pull --parallel
        env:
          COMPOSE_PROFILES: "base,postgres,statsd,redis,memgraph,aws,gcp"
      - name: Tests
        run: go run gotest.tools/gotestsum@latest -f testname -- ./... -count=1 -coverprofile=coverage.txt -covermode=atomic -shuffle=on -tags=external_deps
        env:
          AWS_ACCESS_KEY_ID: "localstack"
          AWS_SECRET_ACCESS_KEY: "localstack"
          AWS_REGION: "eu-central-1"
      - name: Formatter
        run: go fmt ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build --accept-flake-config
